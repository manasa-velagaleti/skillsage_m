    <script>
        // JavaScript function remains the same
         function distinct(array) {
            return array.filter(function (value, index, self) {
                return self.indexOf(value) === index;
            });
        }
     function filterTable() {
    var empid = document.getElementById("empidInput").value.toUpperCase();
    var skillid = document.getElementById("skillidInput").value.toUpperCase();
    var proficiency = document.getElementById("proficiencyInput").value.toUpperCase();
    var exp = document.getElementById("expInput").value.toUpperCase();
    var certSource = document.getElementById("certSourceInput").value.toUpperCase();
    var fullName = document.getElementById("fullNameInput").value.toUpperCase();
    var skillName = document.getElementById("skillNameInput").value.toUpperCase();
    var domain = document.getElementById("domainInput").value.toUpperCase();
    var subdomain = document.getElementById("subdomainInput").value.toUpperCase();
 
    var table = document.getElementById("employeeSkillTable");
    var rows = table.getElementsByTagName("tr");
 
    // Loop through all table rows, except the first one (header row)
    for (var i = 1; i < rows.length; i++) {
        var row = rows[i];
        var cells = row.getElementsByTagName("td");
        var display = true; // Flag to determine if the row should be displayed
 
        // Check each cell against the filter criteria
        if (
            (empid && cells[0].innerText.toUpperCase().indexOf(empid) === -1) ||
            (skillid && cells[1].innerText.toUpperCase().indexOf(skillid) === -1) ||
            (proficiency && cells[2].innerText.toUpperCase().indexOf(proficiency) === -1) ||
            (exp && cells[3].innerText.toUpperCase().indexOf(exp) === -1) ||
            (certSource && cells[4].innerText.toUpperCase().indexOf(certSource) === -1) ||
            (fullName && cells[5].innerText.toUpperCase().indexOf(fullName) === -1) ||
            (skillName && cells[6].innerText.toUpperCase().indexOf(skillName) === -1) ||
            (domain && cells[7].innerText.toUpperCase().indexOf(domain) === -1) ||
            (subdomain && cells[8].innerText.toUpperCase().indexOf(subdomain) === -1)
        ) {
            display = false; // If any criteria doesn't match, set display flag to false
        }
 
        // Show or hide the row based on the display flag
        row.style.display = display ? "" : "none";
    }
}
 
         // JavaScript functions remain unchanged
    function openModal() {
        var modal = document.getElementById("myModal");
        modal.style.display = "block";
    }
 
    function closeModal() {
        var modal = document.getElementById("myModal");
        modal.style.display = "none";
    }
 
    function applyFilters() {
        // Apply filters and trigger search
        filterTable();
        closeModal();
    }
         function filterTable1() {
        var input = document.getElementById("searchInput").value.toUpperCase();
        var table = document.getElementById("employeeSkillTable");
        var rows = table.getElementsByTagName("tr");
 
        for (var i = 1; i < rows.length; i++) {
            var row = rows[i];
            var cells = row.getElementsByTagName("td");
            var display = false;
 
            for (var j = 0; j < cells.length; j++) {
                var cell = cells[j];
                if (cell.innerText.toUpperCase().indexOf(input) > -1) {
                    display = true;
                    break;
                }
            }
 
            row.style.display = display ? "" : "none";
        }
    }
    </script>

<input type="text" id="searchInput" onkeyup="filterTable1()" placeholder="Search...">

<table border="1" id="employeeSkillTable">

        <td th:text="${employeeSkill.skills.skillname}"></td>
        <td th:text="${employeeSkill.skills.domain}"></td>
        <td th:text="${employeeSkill.skills.subdomain}"></td>
    </tr>
    </tbody>
</table>
 
 
<!-- Include html2pdf library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
 
<script>
    function downloadHTMLPage() {
        // Select the table element
        const table = document.querySelector('table');
 
        // Define the options for html2pdf
        const options = {
            filename: 'report.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'pt', format: 'a4', orientation: 'portrait' }
        };
 
        // Convert the table to PDF
        html2pdf().from(table).set(options).save();
    }
</script>
 
<!-- Download Report button -->
<div style="text-align: center; margin-top: 20px;">
    <button onclick="downloadHTMLPage()" class="download-button">Download Report</button>
</div>
